[pytest]
testpaths = tests
markers =
    smoke: fast critical-path checks
    regression: full functional coverage of the framework tests
    demo: learning/concept demos under tests/demos (not run in CI)
# Report paths are relative to the directory pytest is run from - run from the repo root.
# Base URL comes from config/<env>.json (--env / TEST_ENV) unless --base-url is given.
addopts =
    --strict-markers
    --junitxml=reports/junit.xml
    --html=reports/report.html
    --self-contained-html
    --output=reports/test-results
    --tracing=retain-on-failure
    --screenshot=only-on-failure
# Captured logs show in failure output and the HTML report; add --log-cli-level=INFO to stream them.
# Under xdist, tests/conftest.py gives each worker its own file (pytest_gw0.log, ...).
log_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s: %(message)s
log_date_format = %H:%M:%S
log_file = reports/pytest.log
log_file_level = INFO
